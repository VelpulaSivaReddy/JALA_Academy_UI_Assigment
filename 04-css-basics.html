<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Basics</title>
<style>
/* CSS comments explain styles and are ignored by the browser. */
html,body{min-height:100%}
body{margin:0;font-family:Arial,sans-serif;background-color:#eef3f8;
 background-image:url('https://images.unsplash.com/photo-1497250681960-ef046c08a56e?w=1200');
 background-repeat:no-repeat;background-position:center;background-size:cover;background-attachment:fixed}
main{margin:30px;padding:25px;background:rgba(255,255,255,.9);border-radius:12px}
.borders{padding:20px;border-top:5px solid red;border-right:5px dashed green;border-bottom:5px dotted blue;border-left:5px double purple}
.box-px{width:300px;height:100px;background:#cde}
.box-percent{width:70%;height:100px;background:#dec}
h1{font-family:Georgia,serif;font-size:34px;color:#123;text-align:center;font-style:italic}
p{font-family:Verdana,sans-serif;font-size:18px;color:#345;text-align:justify}
</style></head><body><main><h1>CSS Basics</h1><p>CSS controls presentation: colors, spacing, borders, typography and layout.</p>
<div class="borders">Different border styles on each side.</div><h2>Pixel dimensions</h2><div class="box-px">300px wide × 100px high</div>
<h2>Percentage width</h2><div class="box-percent">70% wide × 100px high</div></main></body></html>
